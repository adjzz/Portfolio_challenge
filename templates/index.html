<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Ralf Adjay F. Estenor — Home</title>
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/darkmode.css">
  <link rel="stylesheet" href="css/rabbit.css">
</head>
<body>

  <div id="intro-screen">
    <div class="intro-content">

      <!-- Monitor -->
      <div class="monitor">
        <div class="monitor-screen">
          <div class="typing-line">
            Ralf Adjay's Portfolio ...
          </div>
        </div>
        <div class="monitor-stand"></div>
      </div>

      <!-- Paper Plane -->
      <div class="plane-orbit">
        <div class="paper-plane">✈️</div>
      </div>

      <!-- Hand -->
      <div class="typing-hand">⌨️</div>

    </div>
  </div>
  
  <header>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="projects.html">Projects</a>
      <a href="contacts.html">Contact</a>
    </nav>

    <div class="theme-toggle">
      <input type="checkbox" id="darkToggle">
      <label for="darkToggle" class="toggle-label"></label>
    </div>
  </header>

  <main>
    <div class="rabbit rabbit1">
      <div class="body"></div>
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="nose"></div>
      <div class="whisker left"></div>
      <div class="whisker right"></div>
    </div>

    <div class="rabbit rabbit2">
      <div class="body"></div>
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="nose"></div>
      <div class="whisker left"></div>
      <div class="whisker right"></div>
    </div>

    <div class="profile-container">
      <img src="images/Profile ni adjay.JPEG" alt="profile" class="profile-img">
      <h1>Ralf Adjay F. Estenor</h1>
      <p class="bio">“The Lord is my strength and my guide; in Him I trust for every step I take.” <br> Psalm 23 & Psalm 28:7</p>
    </div>
  </main>

  <footer>
    © <span id="currentYear"></span> Ralf Adjay's Portfolio
  </footer>

  <script>
    document.getElementById("currentYear").textContent = new Date().getFullYear();
    const toggle = document.getElementById("darkToggle");

    
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
      toggle.checked = true;
    }

    
    toggle.addEventListener("change", () => {
      document.body.classList.toggle("dark");

      if (document.body.classList.contains("dark")) {
        localStorage.setItem("theme", "dark");
      } else {
        localStorage.setItem("theme", "light");
      }
    });

    
    document.addEventListener("DOMContentLoaded", () => {
      
      const mainContent = document.querySelector('main');
      mainContent.classList.add('swipe-rotate-animation');
      const navLinks = document.querySelectorAll('nav a');
      navLinks.forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault(); 

          const targetPage = this.getAttribute('href');
          mainContent.classList.add('swipe-rotate-animation');
          setTimeout(() => {
            window.location.href = targetPage;
          }, 100); 
        });
      });
    });

    setTimeout(() => {
      const intro = document.getElementById('intro-screen');
      if (intro) intro.remove();
    }, 3000);

  </script>


</body>
</html>
