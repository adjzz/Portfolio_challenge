<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name — Contact</title>
  <link rel="stylesheet" href="css/contacts.css">
  <link rel="stylesheet" href="css/darkmode.css">
  <link rel="stylesheet" href="css/rabbit.css">
  <link rel="stylesheet" href="css/create-contact.css">
</head>

<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="contacts.html" class="active">Contact</a>
    </nav>
    <div class="theme-toggle">
      <input type="checkbox" id="darkToggle">
      <label for="darkToggle" class="toggle-label"></label>
    </div>
  </header>


  <main>

    
    <h1>Contact</h1>

    <div class="contact-info">
      <h2>Email</h2>
      <p>Personal: <a href="mailto:yourname@example.com">beinoyto@gmail.com</a></p>
      <p>Work: <a href="mailto:work@example.com">ralfadjayest@gmail.com</a></p>

      <h2>Phone</h2>
      <p>Mobile: <a href="tel:+1234567890">09162972823</a></p>

      <h2>Emergency Contact</h2>
      <p>Name: Adelina Estenor</p>
      <p>Phone: <a href="tel:+1122334455">09922798248</a></p>
    </div>

    <button id="showFormBtn" class="side-btn">Add Contact</button>

    <div id="create-contact-container">
      <h2>Add New Contact</h2>
      <form id="contactForm">
        <label for="newName">Name</label>
        <input type="text" id="newName" name="name" placeholder="Your Name" required>

        <label for="newEmail">Email</label>
        <input type="email" id="newEmail" name="email" placeholder="Your Email" required>

        <label for="newMessage">Message</label>
        <textarea id="newMessage" name="message" placeholder="Your Message" required></textarea>

        <button type="submit">Submit</button>
      </form>
    </div>


          <div class="rabbit rabbit1">
      <div class="body"></div>
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="nose"></div>
      <div class="whisker left"></div>
      <div class="whisker right"></div>
    </div>

    <div class="rabbit rabbit2">
      <div class="body"></div>
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="nose"></div>
      <div class="whisker left"></div>
      <div class="whisker right"></div>
    </div>

  </main>

  <div id="successAlert" class="success-alert">
    Contact added successfully!
  </div>


  <footer>
    © <span id="currentYear"></span> Ralf Adjay's Portfolio
  </footer>

  <script>
    document.getElementById("currentYear").textContent = new Date().getFullYear();
    document.addEventListener('DOMContentLoaded', () => {

      const toggle = document.getElementById('darkToggle');

      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
        toggle.checked = true;
      }

      toggle.addEventListener("change", () => {
        document.body.classList.toggle("dark");
        localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
      });

      const mainContent = document.querySelector('main');
      mainContent.classList.add('swipe-rotate-animation');
    });

    const showFormBtn = document.getElementById('showFormBtn');
    const contactFormContainer = document.getElementById('create-contact-container');
    contactFormContainer.style.display = 'none';
    showFormBtn.addEventListener('click', () => {
      if(contactFormContainer.style.display === 'none') {
        contactFormContainer.style.display = 'block';
        contactFormContainer.scrollIntoView({ behavior: 'smooth' }); 
      } else {
        contactFormContainer.style.display = 'none';
      }
    });

    const form = document.getElementById('contactForm');
    const successAlert = document.getElementById('successAlert');
    form.addEventListener('submit', function(e) {
      e.preventDefault(); 
      successAlert.classList.add('show');
      setTimeout(() => {
        successAlert.classList.remove('show');
      }, 3000);

      form.reset();
      contactFormContainer.style.display = 'none';
    });
  </script>

</body>
</html>
